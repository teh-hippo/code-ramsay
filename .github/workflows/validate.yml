name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d87bc1744bf1d6a08da7 # v10.0.1
        with:
          python-version: "3.12"
      - run: uv run python scripts/render-agents.py --check
      - run: bash scripts/check-pii.sh
      - run: jq empty plugin.json
